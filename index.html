<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shaxsiy kabinet — IELTS</title>
<meta name="theme-color" content="#4b3fd8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kabinet">
<style>
:root{
  --bg:#f4f5fb; --card:#fff; --ink:#1b2133; --muted:#6b7185; --line:#e6e8f0;
  --brand:#4b3fd8; --brand-2:#6c61ee; --brand-soft:#eceafd;
  --accent:#ff8a3d; --accent-soft:#fff1e7;
  --ok:#17a36b; --ok-soft:#e5f7ef; --warn:#e8a317; --warn-soft:#fdf5e1; --bad:#e04848; --bad-soft:#fdeaea;
  --r:16px; --shadow:0 1px 2px rgba(20,25,50,.05),0 6px 20px rgba(20,25,50,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;min-height:100vh}
a{color:var(--brand)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 500px at 10% -10%,#dcd8ff 0,transparent 60%),radial-gradient(800px 400px at 110% 110%,#ffe0cc 0,transparent 60%),var(--bg)}
.login-card{width:100%;max-width:400px;background:var(--card);border-radius:24px;padding:32px 28px;box-shadow:var(--shadow);text-align:center}
.login-card img{width:72px;height:72px;border-radius:18px;margin-bottom:14px}
.login-card h1{font-size:22px;margin-bottom:4px}
.login-card p.sub{color:var(--muted);margin-bottom:22px}
.field{position:relative;margin-bottom:12px}
.field input{width:100%;padding:14px 48px 14px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:17px;letter-spacing:2px;text-transform:uppercase;outline:none;transition:.15s}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:8px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-weight:600;transition:.15s}
.btn-primary{background:var(--brand);color:#fff;width:100%}
.btn-primary:hover{background:var(--brand-2)}
.btn-primary:disabled{opacity:.6;cursor:wait}
.btn-ghost{background:var(--brand-soft);color:var(--brand);text-decoration:none}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:6px 0}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.demo-hint{margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);font-size:13px;color:#8a4a1c}

/* ---------- App shell ---------- */
header.top{position:sticky;top:0;z-index:10;background:rgba(244,245,251,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-row{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.who{flex:1;min-width:0}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:13px;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.icon-btn:hover{background:#fff;color:var(--ink)}
.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
nav.tabs{max-width:980px;margin:0 auto;display:flex;gap:6px;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:6px}
.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.tab .cnt{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:18px}
main{max-width:980px;margin:0 auto;padding:18px 16px 40px}
h2.sec{font-size:19px;margin:4px 0 14px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:760px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat .lbl{font-size:13px;color:var(--muted)}
.stat .val{font-size:26px;font-weight:800;margin-top:2px}
.stat .hint{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:#a06d00} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--brand-soft);color:var(--brand)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;gap:12px;align-items:flex-start}
.item .ic{width:40px;height:40px;flex:0 0 40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px}
.item .body{flex:1;min-width:0}
.item .t{font-weight:700}
.item .d{color:var(--muted);font-size:14px;white-space:pre-line}
.meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty div{font-size:34px;margin-bottom:6px}
.news{background:linear-gradient(135deg,var(--brand),#7b5cf0);color:#fff}
.news .d{color:rgba(255,255,255,.85)}

/* bands */
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.band{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.band .k{font-size:12px;color:var(--muted);font-weight:600}
.band .v{font-size:20px;font-weight:800}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.overall{width:62px;height:62px;flex:0 0 62px;border-radius:16px;background:var(--brand);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.overall b{font-size:22px;line-height:1}.overall span{font-size:10px;opacity:.85}
.fb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:560px){.fb{grid-template-columns:1fr}.bands{grid-template-columns:repeat(2,1fr)}}
.fb div{border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-line}
.fb .g{background:var(--ok-soft)} .fb .i{background:var(--accent-soft)}
.fb b{display:block;font-size:12px;margin-bottom:2px}
.chart{width:100%;height:auto;display:block}
/* attendance */
.cal{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:38px;height:38px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;line-height:1.1}
.dot small{font-weight:500;font-size:9px;opacity:.8}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center;flex:0 0 92px}
.ring div{width:70px;height:70px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
td.num,th.num{text-align:right}
.tbl-wrap{overflow-x:auto}
footer.ft{max-width:980px;margin:0 auto;padding:0 16px 30px;text-align:center;font-size:13px;color:var(--muted)}
footer.ft a{font-weight:600;text-decoration:none}
.install{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.install p{flex:1;font-size:14px}
.loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:50}
.loader i{width:42px;height:42px;border:4px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
</style>
</head>
<body>

<div class="loader hidden" id="loader"><i></i></div>

<!-- ============ LOGIN ============ -->
<section id="login">
  <div class="login-card">
    <img src="icon-192.png" alt="">
    <h1 id="schoolTitle">Shaxsiy kabinet</h1>
    <p class="sub" id="teacherLine"></p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <input id="codeInput" type="password" placeholder="Kodingizni kiriting" maxlength="20" required>
        <button type="button" class="eye" id="eyeBtn" aria-label="Kodni ko'rsatish">👁</button>
      </div>
      <div class="err" id="loginErr"></div>
      <button class="btn btn-primary" id="loginBtn" type="submit">Kirish</button>
    </form>
    <p class="note">🔒 Kodni hech kimga bermang — bu sizning shaxsiy kalitingiz.</p>
    <div class="demo-hint hidden" id="demoHint">Namuna rejimi: <b>DEMO1</b> kodi bilan kirib ko'ring.</div>
  </div>
</section>

<!-- ============ APP ============ -->
<section id="app" class="hidden">
  <header class="top">
    <div class="top-row">
      <div class="avatar" id="avatar">A</div>
      <div class="who"><b id="stName"></b><span id="stMeta"></span></div>
      <button class="icon-btn" id="refreshBtn" title="Yangilash"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
      <button class="icon-btn" id="logoutBtn" title="Chiqish"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="view"></main>
  <footer class="ft">
    <p id="ftTeacher"></p>
    <p>📢 Telegram kanal: <a id="ftChannel" target="_blank" rel="noopener"></a></p>
  </footer>
</section>

<script>
/* =========================================================
   SOZLAMALAR — faqat shu qismni o'zgartiring
   ========================================================= */
const CONFIG = {
  API_URL: "",                       // Apps Script Web App URL (bo'sh bo'lsa — namuna/demo rejim)
  SCHOOL: "IELTS Shaxsiy kabinet",
  TEACHER: "Nilufar ustoz",
  TEACHER_TG: "Instructor_Miss_Nilufar",   // savol uchun Telegram akkaunt (@ belgisisiz)
  CHANNEL: "OnlineIELTS_NA",               // Telegram kanal (@ belgisisiz)
  CURRENCY: "so'm"
};
/* ========================================================= */

const $ = s => document.querySelector(s);
const MONTHS = ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u||'').trim()) ? String(u).trim() : '';
const num = v => { const n = parseFloat(String(v ?? '').replace(/\s/g,'').replace(',', '.')); return isNaN(n) ? null : n; };
const bandRound = x => Math.round(x * 2) / 2;                // IELTS: 6.25→6.5, 6.75→7, 6.125→6
const fmtBand = x => x == null ? '—' : (Number.isInteger(x) ? x.toFixed(1) : String(x));
const money = v => { const n = num(v); return n == null ? (v || '—') : n.toLocaleString('ru-RU').replace(/,/g,' ') + ' ' + CONFIG.CURRENCY; };
function parseDate(s){
  s = String(s||'').trim(); if(!s) return null; let m;
  if((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1], m[2]-1, +m[3]);
  if((m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/))) return new Date(+m[3], m[2]-1, +m[1]);
  const d = new Date(s); return isNaN(d) ? null : d;
}
const fmtDate = s => { const d = parseDate(s); return d ? `${d.getDate()}-${MONTHS[d.getMonth()]}, ${d.getFullYear()}` : esc(s||''); };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const overallOf = arr => { const v = arr.map(num); return v.every(x => x != null) ? bandRound(v.reduce((a,b)=>a+b,0)/v.length) : null; };

let DATA = null, CODE = null, TAB = 'home', taskFilter = 'all';

/* ---------------- Data ---------------- */
async function fetchData(code){
  if(!CONFIG.API_URL) return demoData(code);
  const r = await fetch(CONFIG.API_URL + '?code=' + encodeURIComponent(code) + '&t=' + Date.now());
  if(!r.ok) throw new Error('Tarmoq xatosi');
  return r.json();
}

function prepare(d){
  const t0 = today();
  d.tasks = (d.tasks||[]).map(t => {
    const dl = parseDate(t.deadline);
    t.state = t.isDone ? 'done' : (dl && dl < t0 ? 'late' : 'todo');
    return t;
  }).sort((a,b) => (parseDate(a.deadline)||0) - (parseDate(b.deadline)||0));
  d.mocks = (d.mocks||[]).map(m => ({...m, overall: overallOf([m.L,m.R,m.W,m.S])}))
            .sort((a,b) => (parseDate(a.date)||0) - (parseDate(b.date)||0));
  d.speaking = (d.speaking||[]).map(s => ({...s, overall: overallOf([s.fc,s.lr,s.gra,s.p])}))
            .sort((a,b) => (parseDate(b.date)||0) - (parseDate(a.date)||0));
  d.attendance = (d.attendance||[]).sort((a,b) => (parseDate(a.date)||0) - (parseDate(b.date)||0));
  d.news = (d.news||[]).sort((a,b) => (parseDate(b.date)||0) - (parseDate(a.date)||0));
  return d;
}

/* ---------------- Login ---------------- */
async function login(code, silent){
  code = String(code||'').trim().toUpperCase();
  if(!code) return;
  $('#loginErr').textContent = '';
  $('#loginBtn').disabled = true; if(silent) $('#loader').classList.remove('hidden');
  try{
    const d = await fetchData(code);
    if(!d || !d.ok) throw new Error((d && d.error) || "Kod noto'g'ri");
    DATA = prepare(d); CODE = code; store.set('kabinet_code', code);
    showApp();
  }catch(e){
    store.del('kabinet_code');
    $('#login').classList.remove('hidden'); $('#app').classList.add('hidden');
    $('#loginErr').textContent = e.message === 'Failed to fetch' ? "Internetga ulanib bo'lmadi. Qayta urinib ko'ring." : e.message;
  }finally{
    $('#loginBtn').disabled = false; $('#loader').classList.add('hidden');
  }
}

function showApp(){
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  const s = DATA.student;
  $('#stName').textContent = s.name || 'O\'quvchi';
  $('#stMeta').textContent = [s.group, s.level && ('Daraja: ' + s.level)].filter(Boolean).join(' · ');
  $('#avatar').textContent = (s.name || '?').trim().charAt(0).toUpperCase();
  renderTabs(); render();
}

/* ---------------- Tabs ---------------- */
const TABS = [
  ['home','🏠','Bosh sahifa'], ['tasks','📝','Vazifalar'], ['mock','📊','Mock natijalari'],
  ['speaking','🎤','Speaking feedback'], ['att','📅','Davomat'], ['pay','💳',"To'lov"], ['mat','📚','Materiallar']
];
function renderTabs(){
  const pending = DATA.tasks.filter(t => t.state !== 'done').length;
  $('#tabs').innerHTML = TABS.map(([id,ic,name]) =>
    `<button class="tab ${TAB===id?'active':''}" data-tab="${id}">${ic} ${name}${id==='tasks'&&pending?`<span class="cnt">${pending}</span>`:''}</button>`).join('');
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if(!b) return;
  TAB = b.dataset.tab; renderTabs(); render(); window.scrollTo({top:0,behavior:'smooth'});
  b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
});

function render(){
  const v = { home:vHome, tasks:vTasks, mock:vMock, speaking:vSpeaking, att:vAtt, pay:vPay, mat:vMat }[TAB];
  $('#view').innerHTML = v();
}
const empty = (ic, txt) => `<div class="card empty"><div>${ic}</div>${txt}</div>`;

/* ---------------- Views ---------------- */
function attStats(){
  const a = DATA.attendance, n = a.length;
  const st = x => String(x.status||'').toLowerCase();
  const came = a.filter(x => st(x).startsWith('keldi') || st(x).startsWith('kech')).length;
  const late = a.filter(x => st(x).startsWith('kech')).length;
  const miss = a.filter(x => st(x).startsWith('kelma')).length;
  const exc = a.filter(x => st(x).startsWith('sabab')).length;
  const base = n - exc;
  return { n, came, late, miss, exc, pct: base ? Math.round(came / base * 100) : null };
}
function payClass(s){ s = String(s||'').toLowerCase(); return s.includes("to'lanma") || s.includes('tolanma') || s.includes('to‘lanma') ? 'p-bad' : s.includes('qisman') ? 'p-warn' : s ? 'p-ok' : 'p-info'; }

function vHome(){
  const s = DATA.student, last = [...DATA.mocks].reverse().find(m => m.overall != null);
  const pending = DATA.tasks.filter(t => t.state !== 'done');
  const a = attStats(), lastPay = DATA.payments[DATA.payments.length-1];
  const tgt = num(s.target);
  let html = installBanner();
  html += DATA.news.slice(0,2).map(n => `<div class="card news" style="margin-bottom:12px"><div class="item"><div class="ic" style="background:rgba(255,255,255,.18)">📣</div><div class="body"><div class="t">E'lon · ${fmtDate(n.date)}</div><div class="d">${esc(n.text)}</div></div></div></div>`).join('');
  html += `<div class="grid g4" style="margin-bottom:14px">
    <div class="card stat"><div class="lbl">Oxirgi mock (Overall)</div><div class="val">${last?fmtBand(last.overall):'—'}</div><div class="hint">${tgt?`Maqsad: ${fmtBand(tgt)}${last?` · ${last.overall>=tgt?'✅ erishildi':'yana '+fmtBand(+(tgt-last.overall).toFixed(1))}`:''}`:'&nbsp;'}</div></div>
    <div class="card stat"><div class="lbl">Bajarilmagan vazifalar</div><div class="val" style="color:${pending.length?'var(--accent)':'var(--ok)'}">${pending.length}</div><div class="hint">${DATA.tasks.filter(t=>t.state==='late').length} tasi muddati o'tgan</div></div>
    <div class="card stat"><div class="lbl">Davomat</div><div class="val">${a.pct==null?'—':a.pct+'%'}</div><div class="hint">${a.n} ta darsdan ${a.came} tasida</div></div>
    <div class="card stat"><div class="lbl">To'lov (${esc(lastPay?.month||'—')})</div><div class="val" style="font-size:18px;margin-top:8px"><span class="pill ${payClass(lastPay?.status)}">${esc(lastPay?.status||"Ma'lumot yo'q")}</span></div></div>
  </div>`;
  html += `<div class="grid g2">
    <div class="card"><h2 class="sec">📝 Yaqin vazifalar</h2>${pending.length ? `<div class="list">${pending.slice(0,4).map(taskRow).join('')}</div>` : '<p class="d" style="color:var(--muted)">Hamma vazifalar bajarilgan 🎉</p>'}</div>
    <div class="card"><h2 class="sec">📈 Mock o'sishi</h2>${DATA.mocks.filter(m=>m.overall!=null).length>1 ? chart() : '<p style="color:var(--muted)">Grafik uchun kamida 2 ta mock natijasi kerak.</p>'}</div>
  </div>`;
  return html;
}

function taskRow(t){
  const map = { done:['p-ok','Bajarildi','✅','var(--ok-soft)'], late:['p-bad',"Muddati o'tgan",'⏰','var(--bad-soft)'], todo:['p-warn','Kutilmoqda','📝','var(--warn-soft)'] }[t.state];
  const dl = parseDate(t.deadline); let left = '';
  if(dl && t.state==='todo'){ const d = Math.round((dl - today())/864e5); left = d===0 ? 'Bugun!' : d===1 ? 'Ertaga' : d + ' kun qoldi'; }
  const link = safeUrl(t.link);
  return `<div class="item"><div class="ic" style="background:${map[3]}">${map[2]}</div><div class="body">
    <div class="t">${esc(t.title)}</div>${t.desc?`<div class="d">${esc(t.desc)}</div>`:''}
    <div class="meta"><span class="pill ${map[0]}">${map[1]}</span>${t.deadline?`<span>📆 ${fmtDate(t.deadline)}</span>`:''}${left?`<b style="color:var(--accent)">${left}</b>`:''}${link?`<a href="${esc(link)}" target="_blank" rel="noopener">Ochish →</a>`:''}</div>
  </div></div>`;
}
function vTasks(){
  const f = { all:DATA.tasks, todo:DATA.tasks.filter(t=>t.state==='todo'), late:DATA.tasks.filter(t=>t.state==='late'), done:DATA.tasks.filter(t=>t.state==='done') };
  const list = f[taskFilter];
  return `<h2 class="sec">📝 Vazifalar</h2>
  <div class="filters">${[['all','Hammasi'],['todo','Kutilmoqda'],['late',"Muddati o'tgan"],['done','Bajarilgan']].map(([k,n]) =>
    `<button class="chip ${taskFilter===k?'active':''}" onclick="taskFilter='${k}';render()">${n} (${f[k].length})</button>`).join('')}</div>
  ${list.length ? `<div class="card"><div class="list">${list.map(taskRow).join('<hr style="border:0;border-top:1px solid var(--line)">')}</div></div>` : empty('📭', "Bu bo'limda vazifa yo'q")}
  <p class="note" style="text-align:center">Vazifani topshirgach, ustoz uni "Bajarildi" deb belgilaydi.</p>`;
}

function chart(){
  const ms = DATA.mocks.filter(m => m.overall != null); if(ms.length < 2) return '';
  const W=520,H=200,P=34, vals = ms.map(m=>m.overall), tgt = num(DATA.student.target);
  const lo = Math.max(0, Math.floor(Math.min(...vals, tgt??9) - 1)), hi = Math.min(9, Math.ceil(Math.max(...vals, tgt??0) + .5));
  const X0 = P + 22, X1 = W - 40, x = i => X0 + i*(X1-X0)/(ms.length-1), y = v => H-P - (v-lo)/(hi-lo||1)*(H-P*2);
  let g = '';
  for(let v=lo; v<=hi; v+=.5){ if(v%1) continue; g += `<line x1="${P}" x2="${W-P/2}" y1="${y(v)}" y2="${y(v)}" stroke="#e6e8f0"/><text x="${P-8}" y="${y(v)+4}" font-size="11" fill="#6b7185" text-anchor="end">${v}</text>`; }
  if(tgt!=null) g += `<line x1="${P}" x2="${W-P/2}" y1="${y(tgt)}" y2="${y(tgt)}" stroke="#ff8a3d" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-P/2}" y="${y(tgt)-6}" font-size="11" fill="#ff8a3d" text-anchor="end">Maqsad ${fmtBand(tgt)}</text>`;
  const pts = ms.map((m,i)=>`${x(i)},${y(m.overall)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<polyline points="${pts}" fill="none" stroke="#4b3fd8" stroke-width="3" stroke-linejoin="round"/>
    ${ms.map((m,i)=>`<circle cx="${x(i)}" cy="${y(m.overall)}" r="5" fill="#fff" stroke="#4b3fd8" stroke-width="3"/><text x="${x(i)}" y="${y(m.overall)-11}" font-size="12" font-weight="700" text-anchor="middle" fill="#1b2133">${fmtBand(m.overall)}</text><text x="${x(i)}" y="${H-10}" font-size="11" text-anchor="middle" fill="#6b7185">${esc(m.test||('#'+(i+1))).slice(0,12)}</text>`).join('')}</svg>`;
}
function bands(pairs){
  return `<div class="bands">${pairs.map(([k,v]) => { const n = num(v); return `<div class="band"><div class="k">${k}</div><div class="v">${fmtBand(n)}</div><div class="bar"><i style="width:${n?n/9*100:0}%"></i></div></div>`; }).join('')}</div>`;
}
function vMock(){
  if(!DATA.mocks.length) return `<h2 class="sec">📊 Mock natijalari</h2>` + empty('📊', "Hali mock test natijalari yo'q");
  const ms = [...DATA.mocks].reverse();
  const best = Math.max(...DATA.mocks.map(m=>m.overall??0));
  return `<h2 class="sec">📊 Mock natijalari</h2>
  ${DATA.mocks.filter(m=>m.overall!=null).length>1 ? `<div class="card" style="margin-bottom:12px">${chart()}</div>` : ''}
  <div class="list">${ms.map(m => `<div class="card">
    <div class="item"><div class="overall" ${m.overall===best&&best?'style="background:var(--accent)"':''}><b>${fmtBand(m.overall)}</b><span>Overall</span></div>
    <div class="body"><div class="t">${esc(m.test||'Mock test')} ${m.overall===best&&best&&DATA.mocks.length>1?'<span class="pill p-warn">🏆 Eng yaxshi</span>':''}</div><div class="meta">📆 ${fmtDate(m.date)}</div></div></div>
    ${bands([['Listening',m.L],['Reading',m.R],['Writing',m.W],['Speaking',m.S]])}
    ${m.comment?`<div class="d" style="margin-top:10px;color:var(--muted)">💬 ${esc(m.comment)}</div>`:''}
  </div>`).join('')}</div>`;
}
function vSpeaking(){
  if(!DATA.speaking.length) return `<h2 class="sec">🎤 Speaking feedback</h2>` + empty('🎤', "Hali speaking feedback yo'q");
  return `<h2 class="sec">🎤 Speaking feedback</h2><div class="list">${DATA.speaking.map(s => { const au = safeUrl(s.audio); return `<div class="card">
    <div class="item"><div class="overall"><b>${fmtBand(s.overall)}</b><span>Band</span></div>
    <div class="body"><div class="t">${esc(s.topic||'Speaking')}</div><div class="meta">📆 ${fmtDate(s.date)}${au?` · <a href="${esc(au)}" target="_blank" rel="noopener">🎧 Audio yozuv</a>`:''}</div></div></div>
    ${bands([['Fluency',s.fc],['Lexical',s.lr],['Grammar',s.gra],['Pronunc.',s.p]])}
    ${(s.good||s.improve)?`<div class="fb">${s.good?`<div class="g"><b>👍 Yaxshi tomonlar</b>${esc(s.good)}</div>`:''}${s.improve?`<div class="i"><b>🎯 Ustida ishlash kerak</b>${esc(s.improve)}</div>`:''}</div>`:''}
  </div>`; }).join('')}</div>`;
}
function vAtt(){
  const a = attStats();
  if(!a.n) return `<h2 class="sec">📅 Davomat</h2>` + empty('📅', "Hali davomat belgilanmagan");
  const col = s => { s=String(s||'').toLowerCase(); return s.startsWith('kelma')?['var(--bad-soft)','var(--bad)','✗']:s.startsWith('kech')?['var(--warn-soft)','#a06d00','!']:s.startsWith('sabab')?['var(--brand-soft)','var(--brand)','S']:['var(--ok-soft)','var(--ok)','✓']; };
  return `<h2 class="sec">📅 Davomat</h2>
  <div class="card" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
    <div class="ring" style="--p:${a.pct||0}"><div>${a.pct==null?'—':a.pct+'%'}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="pill p-ok">✓ Keldi: ${a.came - a.late}</span><span class="pill p-warn">! Kechikdi: ${a.late}</span>
      <span class="pill p-bad">✗ Kelmadi: ${a.miss}</span><span class="pill p-info">S Sababli: ${a.exc}</span>
    </div>
  </div>
  <div class="card" style="margin-bottom:12px"><div class="cal">${DATA.attendance.map(x => { const c = col(x.status), d = parseDate(x.date); return `<div class="dot" style="background:${c[0]};color:${c[1]}" title="${esc(x.date)} — ${esc(x.status)}${x.note?' ('+esc(x.note)+')':''}">${c[2]}<small>${d?d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0'):''}</small></div>`; }).join('')}</div></div>
  <div class="card tbl-wrap"><table><thead><tr><th>Sana</th><th>Holat</th><th>Izoh</th></tr></thead><tbody>
  ${[...DATA.attendance].reverse().map(x => { const c = col(x.status); return `<tr><td>${fmtDate(x.date)}</td><td><span class="pill" style="background:${c[0]};color:${c[1]}">${esc(x.status)}</span></td><td style="color:var(--muted)">${esc(x.note)}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}
function vPay(){
  const p = DATA.payments;
  if(!p.length) return `<h2 class="sec">💳 To'lov holati</h2>` + empty('💳', "To'lov ma'lumotlari yo'q");
  const debt = p.reduce((s,x) => s + Math.max(0, (num(x.amount)||0) - (num(x.paid)||0)), 0);
  const tg = CONFIG.TEACHER_TG ? `https://t.me/${encodeURIComponent(CONFIG.TEACHER_TG)}` : '';
  return `<h2 class="sec">💳 To'lov holati</h2>
  <div class="card stat" style="margin-bottom:12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
    <div style="flex:1"><div class="lbl">Umumiy qarzdorlik</div><div class="val" style="color:${debt?'var(--bad)':'var(--ok)'}">${debt?money(debt):"Qarz yo'q ✅"}</div></div>
    ${debt&&tg?`<a class="btn btn-ghost" href="${tg}" target="_blank" rel="noopener">Ustozga yozish</a>`:''}
  </div>
  <div class="list">${[...p].reverse().map(x => { const a = num(x.amount)||0, pd = num(x.paid)||0, pc = a ? Math.min(100, pd/a*100) : 0; return `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><b>${esc(x.month)}</b><span class="pill ${payClass(x.status)}">${esc(x.status)}</span></div>
    <div class="meta" style="justify-content:space-between"><span>To'langan: <b style="color:var(--ink)">${money(x.paid)}</b> / ${money(x.amount)}</span>${x.date?`<span>📆 ${fmtDate(x.date)}</span>`:''}</div>
    <div class="bar" style="height:8px;margin-top:8px"><i style="width:${pc}%;background:${pc>=100?'var(--ok)':'var(--accent)'}"></i></div>
  </div>`; }).join('')}</div>`;
}
function vMat(){
  const m = DATA.materials;
  if(!m.length) return `<h2 class="sec">📚 Materiallar</h2>` + empty('📚', "Hali materiallar qo'shilmagan");
  const ic = t => { t=String(t||'').toLowerCase(); return t.includes('video')?'🎬':t.includes('pdf')?'📄':t.includes('test')?'🧪':t.includes('audio')?'🎧':'🔗'; };
  return `<h2 class="sec">📚 Materiallar</h2><div class="grid g2">${m.map(x => { const l = safeUrl(x.link); return `
    <a class="card item" style="text-decoration:none;color:inherit" ${l?`href="${esc(l)}" target="_blank" rel="noopener"`:''}>
      <div class="ic" style="background:var(--brand-soft)">${ic(x.type)}</div>
      <div class="body"><div class="t">${esc(x.title)}</div><div class="meta">${x.type?`<span class="pill p-info">${esc(x.type)}</span>`:''}${l?'<span>Ochish →</span>':''}</div></div>
    </a>`; }).join('')}</div>`;
}

/* ---------------- Install (PWA) ---------------- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if(DATA && TAB==='home') render(); });
function installBanner(){
  if(store.get('kabinet_install_hide') || matchMedia('(display-mode: standalone)').matches || navigator.standalone) return '';
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if(deferredPrompt) return `<div class="install"><span style="font-size:22px">📲</span><p>Kabinetni telefoningizga ilova sifatida o'rnating.</p><button class="btn btn-ghost" onclick="doInstall()">O'rnatish</button><button class="icon-btn" onclick="hideInstall()">✕</button></div>`;
  if(ios) return `<div class="install"><span style="font-size:22px">📲</span><p>iPhone: pastdagi <b>Ulashish ⬆︎</b> tugmasini bosing → <b>"Ekranga qo'shish"</b>.</p><button class="icon-btn" onclick="hideInstall()">✕</button></div>`;
  return '';
}
async function doInstall(){ if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; render(); }
function hideInstall(){ store.set('kabinet_install_hide','1'); render(); }

$('#eyeBtn').addEventListener('click', () => { const i = $('#codeInput'); i.type = i.type === 'password' ? 'text' : 'password'; });
$('#logoutBtn').addEventListener('click', () => { store.del('kabinet_code'); DATA = null; TAB = 'home'; $('#codeInput').value=''; $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); });
$('#refreshBtn').addEventListener('click', async () => {
  const b = $('#refreshBtn'); b.classList.add('spin');
  try{ const d = await fetchData(CODE); if(d && d.ok){ DATA = prepare(d); showApp(); } } catch(e){ alertMsg("Yangilab bo'lmadi"); }
  b.classList.remove('spin');
});
function alertMsg(t){ const n = document.createElement('div'); n.textContent = t; n.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2133;color:#fff;padding:10px 16px;border-radius:10px;z-index:99'; document.body.appendChild(n); setTimeout(()=>n.remove(),2500); }
